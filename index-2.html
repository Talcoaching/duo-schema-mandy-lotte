<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trainingsschema · Tal&coaching</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--green:#2D4A3E;--cream:#FDFBF3;--gold:#C97B1A;--teal:#2A7A8C;--muted:#6b7c76;--border:#ddd8cc;--white:#fff;--up:#27ae60;--dn:#e74c3c}
body{background:var(--cream);font-family:'Nunito',sans-serif;font-size:14px;color:var(--green);min-height:100vh}

/* AUTH SCREEN */
#authScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.auth-card{background:var(--white);border:1px solid var(--border);border-radius:20px;padding:36px 28px;max-width:380px;width:100%;text-align:center}
.auth-logo{height:28px;margin-bottom:20px}
.auth-title{font-family:'Fraunces',serif;font-size:1.6rem;font-weight:900;color:var(--green);margin-bottom:8px}
.auth-sub{font-size:13px;color:var(--muted);margin-bottom:24px;line-height:1.5}
.auth-input{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:11px 14px;font-family:'Nunito',sans-serif;font-size:14px;color:var(--green);outline:none;margin-bottom:12px;background:var(--cream)}
.auth-input:focus{border-color:var(--teal);background:#fff}
.auth-btn{width:100%;background:var(--green);color:#fff;border:none;border-radius:10px;padding:13px;font-family:'Nunito',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:background .15s}
.auth-btn:hover{background:#1e3329}
.auth-btn:disabled{background:var(--muted);cursor:not-allowed}
.auth-msg{margin-top:14px;font-size:13px;font-weight:600;min-height:20px}
.auth-msg.success{color:var(--teal)}
.auth-msg.error{color:var(--dn)}

/* APP */
#appScreen{display:none}
.header{background:var(--green);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200}
.header::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--gold),var(--teal))}
.header img{height:22px;filter:brightness(0) invert(1)}
.header-right{display:flex;align-items:center;gap:10px}
.client-select{background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.25);border-radius:20px;padding:5px 14px;font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;color:#fff;cursor:pointer;outline:none}
.client-select option{background:var(--green);color:#fff}
.logout-btn{background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.2);border-radius:20px;padding:5px 12px;font-family:'Nunito',sans-serif;font-size:11px;font-weight:700;color:rgba(255,255,255,.7);cursor:pointer}

.top-nav{background:var(--white);border-bottom:1px solid var(--border);padding:10px 14px;display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none;position:sticky;top:51px;z-index:100}
.top-nav::-webkit-scrollbar{display:none}
.nav-btn{flex-shrink:0;padding:6px 13px;border-radius:20px;border:1.5px solid var(--border);background:var(--cream);font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap;transition:all .15s}
.nav-btn.active{background:var(--green);border-color:var(--green);color:#fff}
.nav-btn.has-data{border-color:var(--teal);color:var(--teal)}
.nav-btn.has-data.active{background:var(--green);border-color:var(--green);color:#fff}

.container{max-width:720px;margin:0 auto;padding:16px 13px 90px}
.page-label{font-family:'Fraunces',serif;font-size:1.25rem;font-weight:900;color:var(--green);margin-bottom:12px;padding:0 4px}
.page-label span{font-style:italic;color:var(--gold)}

.day-block{background:var(--white);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:14px}
.day-header{background:var(--green);padding:10px 16px;display:flex;align-items:center;justify-content:space-between}
.day-title{font-family:'Fraunces',serif;font-size:.95rem;font-weight:900;color:#fff}
.day-badge{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,.4)}

.exercise{border-bottom:1px solid var(--border);padding:10px 15px}
.exercise:last-of-type{border-bottom:none}
.ex-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:2px}
.ex-name{font-weight:700;font-size:13px;color:var(--green);flex:1}
.ex-tag{font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;padding:2px 7px;border-radius:20px;flex-shrink:0}
.tag-compound{background:#edf2f0;color:var(--green)}
.tag-isolation{background:#fdf6ec;color:var(--gold)}
.tag-core{background:#eef7f9;color:var(--teal)}
.tag-upper{background:#f0edf8;color:#6c3483}
.ex-target{font-size:11px;color:var(--muted);margin-bottom:5px}
.ex-note{font-size:11px;color:var(--teal);font-style:italic;margin-bottom:6px;line-height:1.4;padding:4px 8px;background:#eef7f9;border-radius:6px}
.ex-progress{font-size:11px;color:var(--gold);font-style:italic;margin-bottom:6px;padding:4px 8px;background:#fdf6ec;border-radius:6px}

.set-header{display:grid;gap:4px;margin-bottom:3px}
.set-row{display:grid;gap:4px;margin-bottom:4px;align-items:center}
.col-hdr{font-size:10px;font-weight:800;text-transform:uppercase;color:var(--muted);text-align:center}
.set-num{font-size:11px;color:var(--muted);font-weight:700;text-align:center}
input[type="text"]{width:100%;background:var(--cream);border:1px solid var(--border);border-radius:7px;padding:5px 4px;font-family:'Nunito',sans-serif;font-size:12px;color:var(--green);text-align:center;outline:none}
input[type="text"]:focus{border-color:var(--teal);background:#fff}
input::placeholder{color:#ccc;font-size:10px}

.vol-toggle{display:flex;align-items:center;justify-content:space-between;margin-top:7px;padding:6px 9px;background:var(--cream);border-radius:8px;border:1px solid var(--border);cursor:pointer;user-select:none}
.vol-left{font-size:11px;font-weight:700;color:var(--green)}
.vol-right{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700}

.day-notes{padding:9px 15px;background:#fafaf7;border-top:1px solid var(--border)}
.day-notes label{font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px}
textarea{width:100%;background:#fff;border:1px solid var(--border);border-radius:8px;padding:6px 8px;font-family:'Nunito',sans-serif;font-size:12px;color:var(--green);outline:none;resize:none;height:52px}
textarea:focus{border-color:var(--teal)}

.save-wrap{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);padding:10px 18px;display:flex;align-items:center;gap:10px;z-index:100}
.btn-save{flex:1;background:var(--green);color:#fff;border:none;border-radius:10px;padding:11px;font-family:'Nunito',sans-serif;font-size:14px;font-weight:700;cursor:pointer}
.btn-save:active{background:#1e3329}
.save-msg{font-size:12px;color:var(--teal);font-weight:700;display:none}

.sync-indicator{font-size:11px;color:rgba(255,255,255,.5);font-weight:600}
.sync-indicator.syncing{color:var(--gold)}
.sync-indicator.synced{color:#6fcf97}
</style>
</head>

async function sendMagicLink(){

function showAuthMsg(msg, type){

async function logout(){

}

// ─── SESSION CHECK ────────────────────────────────────────────────────
async function init(){
  const {data:{session}} = await sb.auth.getSession();
  if(session){
    currentUser = session.user;
    showApp();
  }
  sb.auth.onAuthStateChange((_event, session)=>{
    if(session && !currentUser){
      currentUser = session.user;
      showApp();
    }
  });
}

async function showApp(){
  document.getElementById('authScreen').style.display = 'none';

}

// ─── DATA LAYER ───────────────────────────────────────────────────────
function dataKey(client, week, di, ei, s, t){ return `${client}_w${week}_d${di}_e${ei}_s${s}_${t}`; }
function noteKey(client, week, di){ return `${client}_w${week}_d${di}_note`; }
function overrideKey(client, w, di, ei){ return `${client}_override_w${w}_d${di}_e${ei}`; }

async function loadData(){
  setSyncStatus('syncing');
  try {
    const {data, error} = await sb.from('training_data').select('key,value').eq('user_id', currentUser.id);
    if(error) throw error;
    dbData = {};
    if(data) data.forEach(row => { dbData[row.key] = row.value; });
    setSyncStatus('synced');
  } catch(e){
    console.error('Load error:', e);
    setSyncStatus('error');
  }
}

function getVal(key){ return dbData[key] || ''; }

async function setVal(key, value){
  dbData[key] = value;
  try {
    await sb.from('training_data').upsert({user_id: currentUser.id, key, value}, {onConflict: 'user_id,key'});
  } catch(e){ console.error('Save error:', e); }
}

function setSyncStatus(status){
  const el = document.getElementById('syncIndicator');
  if(!el) return;
  el.className = 'sync-indicator '+status;
  el.title = status === 'syncing' ? 'Bezig met opslaan...' : status === 'synced' ? 'Opgeslagen' : 'Fout bij opslaan';
}

// ─── HELPERS ──────────────────────────────────────────────────────────
function getVol(client,week,di,ei){
  let vol=0;
  const ex=SCHEMA[di].exercises[ei];
  for(let s=0;s<ex.sets;s++){
    const w=parseFloat(getVal(dataKey(client,week,di,ei,s,'w')))||0;
    const r=parseFloat(getVal(dataKey(client,week,di,ei,s,'r')))||0;
    vol+=w*r;
  }
  return Math.round(vol);
}
function getPrev(client,week,di,ei){
  for(let w=week-1;w>=1;w--){
    const v=getVol(client,w,di,ei);
    if(v>0) return {vol:v,week:w};
  }
  return null;
}
function isDynamic(di,ei){
  const ex=SCHEMA[di].exercises[ei];
  if(ex.name!=='Hip thrust') return true;
  const ov=getVal(overrideKey(CLIENT,CW,di,ei));
  if(ov==='dynamic') return true;
  if(ov==='isometric') return false;
  return CW>2;
}

// ─── VOLUME HTML ──────────────────────────────────────────────────────
function volHTML(di,ei){
  const ex=SCHEMA[di].exercises[ei];
  if(!ex.tracked) return '';
  const dynamic=isDynamic(di,ei);
  const isHipThrust=ex.name==='Hip thrust';
  const overrideBtn=isHipThrust?`<button onclick="toggleOverride(${di},${ei})" style="font-size:10px;font-weight:700;padding:3px 8px;border-radius:10px;border:1px solid var(--border);background:var(--cream);color:var(--muted);cursor:pointer;margin-top:5px;">${dynamic?'⏱ Terug naar isometrisch':'🔄 Override → dynamisch'}</button>`:'';
  if(!dynamic){
    let totalSec=0;
    for(let s=0;s<ex.sets;s++) totalSec+=parseFloat(getVal(dataKey(CLIENT,CW,di,ei,s,'r')))||0;
    return `<div style="margin-top:8px;padding:7px 10px;background:#eef7f9;border-radius:8px;border:1px solid #c8e6f0;"><div style="font-size:11px;font-weight:700;color:var(--teal);">⏱ Isometrisch: ${totalSec>0?totalSec+' sec totaal':'Vul seconden in'}</div>${overrideBtn}</div>`;
  }
  const curVol=getVol(CLIENT,CW,di,ei);
  const prev=getPrev(CLIENT,CW,di,ei);
  let diffTxt='Eerste meting',diffColor='var(--muted)';
  if(prev){const d=curVol-prev.vol;if(d>0){diffTxt='↑ +'+d+' kg·reps (w'+prev.week+')';diffColor='var(--up)';}else if(d<0){diffTxt='↓ '+d+' kg·reps (w'+prev.week+')';diffColor='var(--dn)';}else{diffTxt='→ Gelijk';}}
  let maxVol=curVol;for(let w=1;w<=WEEKS;w++){const v=getVol(CLIENT,w,di,ei);if(v>maxVol)maxVol=v;}
  const pct=maxVol>0?Math.round((curVol/maxVol)*100):0;
  const barColor=curVol===0?'var(--border)':prev===null?'var(--teal)':curVol>=prev.vol?'var(--up)':'var(--dn)';
  return `<div style="margin-top:8px;padding:7px 10px;background:var(--cream);border-radius:8px;border:1px solid var(--border);"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;"><span style="font-size:11px;font-weight:700;color:var(--green);">Volume: ${curVol>0?curVol+' kg·reps':'Nog invullen'}</span><span style="font-size:11px;font-weight:700;color:${diffColor};">${diffTxt}</span></div><div style="height:4px;background:var(--border);border-radius:4px;overflow:hidden;"><div style="height:100%;width:${pct}%;background:${barColor};border-radius:4px;transition:width .4s ease;"></div></div>${overrideBtn}</div>`;
}

          <input type="text" placeholder="?" value="${rirv}" data-di="${di}" data-ei="${ei}" data-s="${s}" data-t="rir" onblur="autoSave(this)"></div>`;
      }
      const inten=INTENSITY[CLIENT]?.[ex.name];
      const targetDisplay=inten?`${inten.sets} sets · ${inten.reps} reps · RIR ${inten.rir}`:ex.target;
      const progNote=ex.progress?.[CLIENT];
      const weekNote=CW<=2?progNote:null;
      exHTML+=`<div class="exercise"><div class="ex-top" style="align-items:center;"><div style="flex:1;min-width:0;"><div class="ex-name">${ex.name} <span class="ex-tag ${ex.tag==='compound'?'tag-compound':ex.tag==='isolation'?'tag-isolation':ex.tag==='core'?'tag-core':'tag-upper'}">${ex.pattern}</span></div><div class="ex-target">${targetDisplay}</div></div></div>${ex.note?`<div class="ex-note">${ex.note}</div>`:''}${weekNote?`<div class="ex-progress">📈 ${weekNote}</div>`:''}${sHTML}<div id="vol-${di}-${ei}">${volHTML(di,ei)}</div></div>`;
    });
    const savedNotes=getVal(noteKey(CLIENT,CW,di));
    db.innerHTML=`<div class="day-header"><div class="day-title">${dayDef.day}</div><div class="day-badge">${dayDef.badge}</div></div>${exHTML}<div class="day-notes"><label>Notities</label><textarea placeholder="Hoe voelde het? Wat viel op?" data-di="${di}" onblur="saveNote(this)">${savedNotes}</textarea></div>`;
    c.appendChild(db);
  });
}

// ─── INTENSITY ────────────────────────────────────────────────────────
const INTENSITY = {
  mandy: {'Squat':{sets:3,reps:'8-10',rir:'2-3'},'Hip thrust':{sets:3,reps:'8-12',rir:'2-3'}},
  lotte: {'Squat':{sets:3,reps:'10-12',rir:'2-3'},'Hip thrust':{sets:3,reps:'10-15',rir:'2-3'}},
};

// ─── SAVE ─────────────────────────────────────────────────────────────
async function autoSave(inp){
  const key=dataKey(CLIENT,CW,inp.dataset.di,inp.dataset.ei,inp.dataset.s,inp.dataset.t);
  await setVal(key, inp.value);
  setSyncStatus('synced');
}
async function saveNote(ta){
  await setVal(noteKey(CLIENT,CW,ta.dataset.di), ta.value);
}
function liveUpdate(inp){
  dbData[dataKey(CLIENT,CW,inp.dataset.di,inp.dataset.ei,inp.dataset.s,inp.dataset.t)]=inp.value;
  const di=parseInt(inp.dataset.di),ei=parseInt(inp.dataset.ei);
  if(SCHEMA[di].exercises[ei].tracked) document.getElementById('vol-'+di+'-'+ei).innerHTML=volHTML(di,ei);
}
async function saveWeek(){
  setSyncStatus('syncing');
  const saves=[];
  document.querySelectorAll('input[data-di]').forEach(i=>{ const k=dataKey(CLIENT,CW,i.dataset.di,i.dataset.ei,i.dataset.s,i.dataset.t); dbData[k]=i.value; saves.push({user_id:currentUser.id,key:k,value:i.value}); });
  document.querySelectorAll('textarea[data-di]').forEach(t=>{ const k=noteKey(CLIENT,CW,t.dataset.di); dbData[k]=t.value; saves.push({user_id:currentUser.id,key:k,value:t.value}); });
  try{ await sb.from('training_data').upsert(saves,{onConflict:'user_id,key'}); setSyncStatus('synced'); }catch(e){ setSyncStatus('error'); }
  buildNav();
  const msg=document.getElementById('saveMsg');
  msg.style.display='block';
  setTimeout(()=>msg.style.display='none',2500);
}
async function toggleOverride(di,ei){
  const key=overrideKey(CLIENT,CW,di,ei);
  const current=isDynamic(di,ei);
  await setVal(key, current?'isometric':'dynamic');
  renderWeek();
}
async function switchClient(){
  CLIENT=document.getElementById('clientSelect').value;
  CW=1;
  buildNav();
  renderWeek();
}

// ─── NAV ──────────────────────────────────────────────────────────────
function buildNav(){
  const nav=document.getElementById('topNav');
  nav.innerHTML='';
  for(let w=1;w<=WEEKS;w++){
    const btn=document.createElement('button');
    btn.className='nav-btn'+(w===CW?' active':'');
    let hasData=false;
    SCHEMA.forEach((d,di)=>d.exercises.forEach((ex,ei)=>{for(let s=0;s<ex.sets;s++) if(getVal(dataKey(CLIENT,w,di,ei,s,'w'))) hasData=true;}));
    if(hasData&&w!==CW) btn.classList.add('has-data');
    btn.textContent='Week '+w;
    btn.onclick=()=>{CW=w;buildNav();renderWeek();};
    nav.appendChild(btn);
  }
}

// ─── SWIPE ────────────────────────────────────────────────────────────
let swipeStartX=0,swipeStartY=0;
document.addEventListener('DOMContentLoaded',()=>{
  const c=document.getElementById('mainContent');
  c.addEventListener('touchstart',e=>{swipeStartX=e.touches[0].clientX;swipeStartY=e.touches[0].clientY;},{passive:true});
  c.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-swipeStartX;const dy=e.changedTouches[0].clientY-swipeStartY;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){if(dx<0&&CW<WEEKS){CW++;buildNav();renderWeek();}else if(dx>0&&CW>1){CW--;buildNav();renderWeek();}}},{passive:true});
});

// ─── ENTER KEY ────────────────────────────────────────────────────────
document.addEventListener('keydown', e=>{ if(e.key==='Enter'&&document.getElementById('authScreen').style.display!=='none') sendMagicLink(); });

init();
</script>
