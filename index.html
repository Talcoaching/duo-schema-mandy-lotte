<title>Trainingsschema · Tal&coaching</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--green:#2D4A3E;--cream:#FDFBF3;--gold:#C97B1A;--teal:#2A7A8C;--muted:#6b7c76;--border:#ddd8cc;--white:#fff;--up:#27ae60;--dn:#e74c3c}
body{background:var(--cream);font-family:'Nunito',sans-serif;font-size:14px;color:var(--green);min-height:100vh}

/* HEADER */
.header{background:var(--green);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200}
.header::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--gold),var(--teal))}
.header img{height:22px;filter:brightness(0) invert(1)}
.header-right{display:flex;align-items:center;gap:10px}

/* CLIENT SELECTOR */
.client-select{background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.25);border-radius:20px;padding:5px 14px;font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;color:#fff;cursor:pointer;outline:none}
.client-select option{background:var(--green);color:#fff}

/* WEEK + DAY NAV */
.top-nav{background:var(--white);border-bottom:1px solid var(--border);padding:10px 14px;display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none;position:sticky;top:51px;z-index:100}
.top-nav::-webkit-scrollbar{display:none}
.nav-btn{flex-shrink:0;padding:6px 13px;border-radius:20px;border:1.5px solid var(--border);background:var(--cream);font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap;transition:all .15s}
.nav-btn.active{background:var(--green);border-color:var(--green);color:#fff}
.nav-btn.has-data{border-color:var(--teal);color:var(--teal)}
.nav-btn.has-data.active{background:var(--green);border-color:var(--green);color:#fff}
.nav-sep{width:1px;height:20px;background:var(--border);flex-shrink:0;margin:0 4px}

/* CONTAINER */
.container{max-width:720px;margin:0 auto;padding:16px 13px 90px}
.page-label{font-family:'Fraunces',serif;font-size:1.25rem;font-weight:900;color:var(--green);margin-bottom:12px;padding:0 4px}
.page-label span{font-style:italic;color:var(--gold)}

/* DAY BLOCK */
.day-block{background:var(--white);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:14px}
.day-header{background:var(--green);padding:10px 16px;display:flex;align-items:center;justify-content:space-between}
.day-title{font-family:'Fraunces',serif;font-size:.95rem;font-weight:900;color:#fff}
.day-badge{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,.4)}

/* EXERCISE */
.exercise{border-bottom:1px solid var(--border);padding:10px 15px}
.exercise:last-of-type{border-bottom:none}
.ex-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:2px}
.ex-name{font-weight:700;font-size:13px;color:var(--green);flex:1}
.ex-tag{font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;padding:2px 7px;border-radius:20px;flex-shrink:0}
.tag-compound{background:#edf2f0;color:var(--green)}
.tag-isolation{background:#fdf6ec;color:var(--gold)}
.tag-core{background:#eef7f9;color:var(--teal)}
.tag-upper{background:#f0edf8;color:#6c3483}
.ex-target{font-size:11px;color:var(--muted);margin-bottom:5px}
.ex-note{font-size:11px;color:var(--teal);font-style:italic;margin-bottom:6px;line-height:1.4;padding:4px 8px;background:#eef7f9;border-radius:6px}
.ex-progress{font-size:11px;color:var(--gold);font-style:italic;margin-bottom:6px;padding:4px 8px;background:#fdf6ec;border-radius:6px}

/* SET INPUTS */
.set-header{display:grid;grid-template-columns:22px 1fr 1fr 1fr 46px;gap:4px;margin-bottom:3px}
.set-row{display:grid;grid-template-columns:22px 1fr 1fr 1fr 46px;gap:4px;margin-bottom:4px;align-items:center}
.col-hdr{font-size:10px;font-weight:800;text-transform:uppercase;color:var(--muted);text-align:center}
.set-num{font-size:11px;color:var(--muted);font-weight:700;text-align:center}
input[type="text"]{width:100%;background:var(--cream);border:1px solid var(--border);border-radius:7px;padding:5px 4px;font-family:'Nunito',sans-serif;font-size:12px;color:var(--green);text-align:center;outline:none}
input[type="text"]:focus{border-color:var(--teal);background:#fff}
input::placeholder{color:#ccc;font-size:10px}

/* VOLUME */
.vol-toggle{display:flex;align-items:center;justify-content:space-between;margin-top:7px;padding:6px 9px;background:var(--cream);border-radius:8px;border:1px solid var(--border);cursor:pointer;user-select:none}
.vol-left{font-size:11px;font-weight:700;color:var(--green)}
.vol-right{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700}
.vol-chev{font-size:10px;color:var(--muted);transition:transform .2s}
.vol-chev.open{transform:rotate(180deg)}
.vol-panel{display:none;padding:8px 9px 4px;border:1px solid var(--border);border-top:none;border-radius:0 0 8px 8px;background:#fff}
.vol-panel.open{display:block}
.vol-row{display:flex;align-items:center;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border);font-size:12px}
.vol-row:last-child{border-bottom:none}
.vol-date{color:var(--muted);font-size:11px}
.vol-val{font-weight:700;color:var(--green)}

/* NOTES */
.day-notes{padding:9px 15px;background:#fafaf7;border-top:1px solid var(--border)}
.day-notes label{font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px}
textarea{width:100%;background:#fff;border:1px solid var(--border);border-radius:8px;padding:6px 8px;font-family:'Nunito',sans-serif;font-size:12px;color:var(--green);outline:none;resize:none;height:52px}
textarea:focus{border-color:var(--teal)}

/* INTENSITY BADGE */
.intensity{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;margin-left:6px}
.intensity.mandy{background:#edf2f0;color:var(--green)}
.intensity.lotte{background:#fdf6ec;color:var(--gold)}

/* SAVE */
.save-wrap{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);padding:10px 18px;display:flex;align-items:center;gap:10px;z-index:100}
.btn-save{flex:1;background:var(--green);color:#fff;border:none;border-radius:10px;padding:11px;font-family:'Nunito',sans-serif;font-size:14px;font-weight:700;cursor:pointer}
.btn-save:active{background:#1e3329}
.save-msg{font-size:12px;color:var(--teal);font-weight:700;display:none}
</style>
</head>

function fKey(client,w,di,ei,s,t){ return `duo_${client}_w${w}_d${di}_e${ei}_s${s}_${t}`; }
function nKey(client,w,di){ return `duo_${client}_w${w}_d${di}_notes`; }

const SUPABASE_URL = 'https://kccimgucvfjmyiltaryg.supabase.co';
const SUPABASE_KEY = 'sb_publishable_jTOq_pdf3fZTBu5vwqxLTA_DvzYxqKU';

async function syncToSupabase(client,w,di,ei,s,t,val){
  try {
    await fetch(SUPABASE_URL+'/rest/v1/duo_sessions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer '+SUPABASE_KEY,
        'Prefer': 'resolution=merge-duplicates'
      },
      body: JSON.stringify({
        client: client,
        week: w,
        day: di,
        exercise: ei,
        set_num: s,
        field: t,
        value: val,
        updated_at: new Date().toISOString()
      })
    });
  } catch(e) {
    console.warn('Sync failed:', e);
  }
}

async function loadFromSupabase(){
  try {
    const res = await fetch(
      SUPABASE_URL+'/rest/v1/duo_sessions?select=*',
      { headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer '+SUPABASE_KEY } }
    );
    const rows = await res.json();
    if(Array.isArray(rows)){
      rows.forEach(row => {
        const k = fKey(row.client, row.week, row.day, row.exercise, row.set_num, row.field);
        localStorage.setItem(k, row.value||'');
      });
    }
    document.getElementById('syncStatus').textContent = '✓ Synced';
    document.getElementById('syncStatus').style.color = '#27ae60';
  } catch(e) {
    console.warn('Load failed:', e);
    document.getElementById('syncStatus').textContent = 'Offline';
  }
}

function getVol(client,w,di,ei){
  let t=0;
  for(let s=0;s<SCHEMA[di].exercises[ei].sets;s++){
    const wv=parseFloat(localStorage.getItem(fKey(client,w,di,ei,s,'w')))||0;
    const rv=parseFloat(localStorage.getItem(fKey(client,w,di,ei,s,'r')))||0;
    t+=wv*rv;
  }
  return Math.round(t);
}
function getPrev(client,w,di,ei){
  for(let pw=w-1;pw>=1;pw--){const v=getVol(client,pw,di,ei);if(v>0) return {vol:v,week:pw};}
  return null;
}

// ─── OVERRIDE KEY ────────────────────────────────────────────────────
function overrideKey(client,w,di,ei){ return `duo_override_${client}_w${w}_d${di}_e${ei}`; }
function isDynamic(di,ei){
  const ex=SCHEMA[di].exercises[ei];
  if(ex.name!=='Hip thrust') return true;
  const ov=localStorage.getItem(overrideKey(CLIENT,CW,di,ei));
  if(ov==='dynamic') return true;
  if(ov==='isometric') return false;
  return CW>2; // default: isometric weeks 1-2
}
function toggleOverride(di,ei){
  const key=overrideKey(CLIENT,CW,di,ei);
  const current=isDynamic(di,ei);
  localStorage.setItem(key, current?'isometric':'dynamic');
  document.getElementById('vol-'+di+'-'+ei).innerHTML=volHTML(di,ei);
  // refresh label inputs
  renderWeek();
}

// ─── SWIPE SUPPORT ───────────────────────────────────────────────────
let swipeStartX=0, swipeStartY=0;
function initSwipe(){
  const c=document.getElementById('mainContent');
  c.addEventListener('touchstart',e=>{
    swipeStartX=e.touches[0].clientX;
    swipeStartY=e.touches[0].clientY;
  },{passive:true});
  c.addEventListener('touchend',e=>{
    const dx=e.changedTouches[0].clientX-swipeStartX;
    const dy=e.changedTouches[0].clientY-swipeStartY;
    if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){
      if(dx<0&&CW<WEEKS){CW++;buildNav();renderWeek();}
      else if(dx>0&&CW>1){CW--;buildNav();renderWeek();}
    }
  },{passive:true});
}

// ─── VOLUME HTML (always visible bar) ────────────────────────────────
function volHTML(di,ei){
  const ex=SCHEMA[di].exercises[ei];
  if(!ex.tracked) return '';

  const dynamic=isDynamic(di,ei);
  const isHipThrust=ex.name==='Hip thrust';

  // Override toggle button (only for hip thrust)
  const overrideBtn=isHipThrust?`<button onclick="toggleOverride(${di},${ei})" style="font-size:10px;font-weight:700;padding:3px 8px;border-radius:10px;border:1px solid var(--border);background:var(--cream);color:var(--muted);cursor:pointer;margin-top:5px;">
    ${dynamic?'⏱ Terug naar isometrisch':'🔄 Override → dynamisch'}
  </button>`:'';

  if(!dynamic){
    // Isometric: track seconds
    let totalSec=0;
    for(let s=0;s<ex.sets;s++) totalSec+=parseFloat(localStorage.getItem(fKey(CLIENT,CW,di,ei,s,'r')))||0;
    const prevSec=(()=>{
      for(let w=CW-1;w>=1;w--){
        let t=0;
        for(let s=0;s<ex.sets;s++) t+=parseFloat(localStorage.getItem(fKey(CLIENT,w,di,ei,s,'r')))||0;
        if(t>0) return {sec:t,week:w};
      }
      return null;
    })();
    let diffTxt='Eerste meting',diffColor='var(--muted)';
    if(prevSec){
      const d=totalSec-prevSec.sec;
      if(d>0){diffTxt='↑ +'+d+' sec (w'+prevSec.week+')';diffColor='var(--up)';}
      else if(d<0){diffTxt='↓ '+d+' sec (w'+prevSec.week+')';diffColor='var(--dn)';}
      else diffTxt='→ Gelijk';
    }
    return `<div style="margin-top:8px;padding:7px 10px;background:#eef7f9;border-radius:8px;border:1px solid #c8e6f0;">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <span style="font-size:11px;font-weight:700;color:var(--teal);">⏱ Isometrisch: ${totalSec>0?totalSec+' sec totaal':'Vul seconden in'}</span>
        <span style="font-size:11px;font-weight:700;color:${diffColor};">${diffTxt}</span>
      </div>
      <div style="font-size:10px;color:var(--muted);margin-top:3px;">Week 3 schakelt over naar volume (kg × reps)</div>
      ${overrideBtn}
    </div>`;
  }

  // Dynamic: track kg*reps volume
  const curVol=getVol(CLIENT,CW,di,ei);
  const prev=getPrev(CLIENT,CW,di,ei);
  let diffTxt='Eerste meting',diffColor='var(--muted)';
  if(prev){
    const d=curVol-prev.vol;
    if(d>0){diffTxt='↑ +'+d+' kg·reps (w'+prev.week+')';diffColor='var(--up)';}
    else if(d<0){diffTxt='↓ '+d+' kg·reps (w'+prev.week+')';diffColor='var(--dn)';}
    else{diffTxt='→ Gelijk (w'+prev.week+')';}
  }
  let maxVol=curVol;
  for(let w=1;w<=WEEKS;w++){const v=getVol(CLIENT,w,di,ei);if(v>maxVol)maxVol=v;}
  const pct=maxVol>0?Math.round((curVol/maxVol)*100):0;
  const barColor=curVol===0?'var(--border)':prev===null?'var(--teal)':curVol>=prev.vol?'var(--up)':'var(--dn)';
  return `<div style="margin-top:8px;padding:7px 10px;background:var(--cream);border-radius:8px;border:1px solid var(--border);">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;">
      <span style="font-size:11px;font-weight:700;color:var(--green);">Volume: ${curVol>0?curVol+' kg·reps':'Nog invullen'}</span>
      <span style="font-size:11px;font-weight:700;color:${diffColor};">${diffTxt}</span>
    </div>
    <div style="height:4px;background:var(--border);border-radius:4px;overflow:hidden;">
      <div style="height:100%;width:${pct}%;background:${barColor};border-radius:4px;transition:width .4s ease;"></div>
    </div>
    ${overrideBtn}
  </div>`;
}

// ─── BUILD NAV ───────────────────────────────────────────────────────
function buildNav(){
  const nav=document.getElementById('topNav');
  nav.innerHTML='';
  // Week buttons
  for(let w=1;w<=WEEKS;w++){
    const btn=document.createElement('button');
    btn.className='nav-btn'+(w===CW?' active':'');
    let hasData=false;
    SCHEMA.forEach((d,di)=>d.exercises.forEach((ex,ei)=>{
      for(let s=0;s<ex.sets;s++) if(localStorage.getItem(fKey(CLIENT,w,di,ei,s,'w'))) hasData=true;
    }));
    if(hasData&&w!==CW) btn.classList.add('has-data');
    btn.textContent='Week '+w;
    btn.onclick=()=>{CW=w;buildNav();renderWeek();};
    nav.appendChild(btn);
  }
}

// ─── RENDER WEEK ─────────────────────────────────────────────────────
function renderWeek(){
  const c=document.getElementById('mainContent');
  const clientLabel=CLIENT==='mandy'?'Mandy':'Lotte';
  c.innerHTML=`<div class="page-label">Week <span>${CW}</span> van 8 · ${clientLabel}</div>`;

  SCHEMA.forEach((dayDef,di)=>{
    const db=document.createElement('div');
    db.className='day-block';
    let exHTML='';

    dayDef.exercises.forEach((ex,ei)=>{
      const sw=[],sr=[],srir=[];
      for(let s=0;s<ex.sets;s++){
        sw.push(localStorage.getItem(fKey(CLIENT,CW,di,ei,s,'w'))||'');
        sr.push(localStorage.getItem(fKey(CLIENT,CW,di,ei,s,'r'))||'');
        srir.push(localStorage.getItem(fKey(CLIENT,CW,di,ei,s,'rir'))||'');
      }
      // Override target based on client intensity
      const inten=INTENSITY[CLIENT]?.[ex.name];
      const targetDisplay=inten?`${inten.sets} sets · ${inten.reps} reps · RIR ${inten.rir}`:ex.target;

      const hasL2=ex.l2!=='';
      const cols=hasL2?'grid-template-columns:22px 1fr 1fr 1fr 46px':'grid-template-columns:22px 1fr 1fr 46px';

      let sHTML=`<div class="set-header" style="display:grid;${cols};gap:4px;margin-bottom:3px;">
        <span></span><span class="col-hdr">Set</span>
        <span class="col-hdr">${ex.l1}</span>
        ${hasL2?`<span class="col-hdr">${ex.l2}</span>`:''}
        <span class="col-hdr">RIR</span>
      </div>`;

      for(let s=0;s<ex.sets;s++){
        sHTML+=`<div class="set-row" style="display:grid;${cols};gap:4px;margin-bottom:4px;align-items:center;">
          <div class="set-num">${s+1}</div>
          <div style="font-size:10px;color:var(--muted);text-align:center;">set ${s+1}</div>
          <input type="text" placeholder="-" value="${sw[s]}" data-di="${di}" data-ei="${ei}" data-s="${s}" data-t="w" oninput="liveUpdate(this)" onchange="autoSave(this)">
          ${hasL2?`<input type="text" placeholder="-" value="${sr[s]}" data-di="${di}" data-ei="${ei}" data-s="${s}" data-t="r" oninput="liveUpdate(this)" onchange="autoSave(this)">`:''}
          <input type="text" placeholder="?" value="${srir[s]}" data-di="${di}" data-ei="${ei}" data-s="${s}" data-t="rir" onchange="autoSave(this)">
        </div>`;
      }

      // Progress note for current week context
      const progNote=ex.progress?.[CLIENT];
      const weekNote=CW<=2?progNote:null;

      const animSVG = ex.anim && ANIMS[ex.anim] ? `<div style="flex-shrink:0;width:52px;display:flex;align-items:center;justify-content:center;">${ANIMS[ex.anim]}</div>` : '';

      exHTML+=`<div class="exercise">
        <div class="ex-top" style="align-items:center;">
          ${animSVG}
          <div style="flex:1;min-width:0;">
            <div class="ex-name">${ex.name} <span class="ex-tag ${ex.tag==='compound'?'tag-compound':ex.tag==='isolation'?'tag-isolation':ex.tag==='core'?'tag-core':'tag-upper'}">${ex.pattern}</span></div>
            <div class="ex-target">${targetDisplay}</div>
          </div>
        </div>
        ${ex.note?`<div class="ex-note">${ex.note}</div>`:''}
        ${weekNote?`<div class="ex-progress">📈 ${weekNote}</div>`:''}
        ${sHTML}
        <div id="vol-${di}-${ei}">${volHTML(di,ei)}</div>
      </div>`;
    });

    const savedNotes=localStorage.getItem(nKey(CLIENT,CW,di))||'';
    db.innerHTML=`<div class="day-header">
      <div class="day-title">${dayDef.day}</div>
      <div class="day-badge">${dayDef.badge}</div>
    </div>${exHTML}
    <div class="day-notes"><label>Notities</label>
      <textarea placeholder="Hoe voelde het? Wat viel op?" data-di="${di}" onchange="saveNote(this)">${savedNotes}</textarea>
    </div>`;
    c.appendChild(db);
  });
}

// ─── SAVE / AUTOSAVE ─────────────────────────────────────────────────
function autoSave(inp){
  const di=inp.dataset.di,ei=inp.dataset.ei,s=inp.dataset.s,t=inp.dataset.t;
  localStorage.setItem(fKey(CLIENT,CW,di,ei,s,t),inp.value);
  syncToSupabase(CLIENT,CW,di,ei,s,t,inp.value);
}
function saveNote(ta){
  localStorage.setItem(nKey(CLIENT,CW,ta.dataset.di),ta.value);
  syncToSupabase(CLIENT+'_notes',CW,ta.dataset.di,0,0,'note',ta.value);
}
function liveUpdate(inp){
  autoSave(inp);
  const di=parseInt(inp.dataset.di),ei=parseInt(inp.dataset.ei);
  if(!SCHEMA[di].exercises[ei].tracked) return;
  document.getElementById('vol-'+di+'-'+ei).innerHTML=volHTML(di,ei);
}
function saveWeek(){
  document.querySelectorAll('input[data-di]').forEach(i=>autoSave(i));
  document.querySelectorAll('textarea[data-di]').forEach(t=>saveNote(t));
  buildNav();
  const msg=document.getElementById('saveMsg');
  msg.style.display='block';
  setTimeout(()=>msg.style.display='none',2500);
}
function switchClient(){
  CLIENT=document.getElementById('clientSelect').value;
  CW=1;
  buildNav();
  renderWeek();
}

loadFromSupabase().then(()=>{
  buildNav();
  renderWeek();
  initSwipe();
}).catch(()=>{
  buildNav();
  renderWeek();
  initSwipe();
});
</script>
